name: Android test build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0 platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test server/*.test.mjs
      - name: Đóng gói Worker cho chủ dự án
        run: |
          node server/pack.mjs
          node --check server/build/distribution/worker.mjs
          cd server/build/distribution
          zip -q "$GITHUB_WORKSPACE/THT-Split-Worker.zip" worker.mjs wrangler.jsonc README.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kiểm tra QR nhận ủng hộ đúng tài khoản
        run: |
          python3 -m pip install 'Pillow>=10,<13' 'zxing-cpp==3.0.0'
          python3 server/verify-donation.py
          python3 server/verify-contact.py
      - name: Kiểm tra gói Worker không triển khai
        working-directory: server
        run: npx --yes wrangler@4 deploy --dry-run --outdir "$RUNNER_TEMP/worker-check"
      # 22/10/2026 (chủ dự án): ký bằng THT_SIGN_* chung với THT Voice = chứng thư platform c8a2e9bc….
      - name: Kiểm tra khóa ký THT_SIGN (platform)
        env:
          KEYSTORE_B64: ${{ secrets.THT_SIGN_KEYSTORE_BASE64 }}
          THT_STORE_PASSWORD: ${{ secrets.THT_SIGN_STORE_PASSWORD }}
          THT_KEY_ALIAS: ${{ secrets.THT_SIGN_KEY_ALIAS }}
          THT_KEY_PASSWORD: ${{ secrets.THT_SIGN_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: c8a2e9bccf597c2fb6dc66bee293fc13f2fc47ec77bc6b2b0d52c11f51192ab8
        run: |
          test -n "$KEYSTORE_B64" && test -n "$THT_STORE_PASSWORD" && test -n "$THT_KEY_ALIAS" && test -n "$THT_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tht-signing.jks"
          chmod 600 "$RUNNER_TEMP/tht-signing.jks"
          actual_cert=$(keytool -exportcert -keystore "$RUNNER_TEMP/tht-signing.jks" -alias "$THT_KEY_ALIAS" -storepass:env THT_STORE_PASSWORD | sha256sum | cut -d ' ' -f 1)
          test "$actual_cert" = "$EXPECTED_CERT_SHA256" || { echo 'THT_SIGN_* không phải chứng thư platform c8a2e9bc…'; exit 1; }
          echo "THT_KEYSTORE_PATH=$RUNNER_TEMP/tht-signing.jks" >> "$GITHUB_ENV"
      - run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
        env:
          THT_CONTROL_URL: ${{ vars.THT_CONTROL_URL || 'https://chiamanhinh.mavoice.workers.dev' }}
          THT_STORE_PASSWORD: ${{ secrets.THT_SIGN_STORE_PASSWORD }}
          THT_KEY_ALIAS: ${{ secrets.THT_SIGN_KEY_ALIAS }}
          THT_KEY_PASSWORD: ${{ secrets.THT_SIGN_KEY_PASSWORD }}
      - name: Xác minh chữ ký APK test
        env:
          EXPECTED_CERT_SHA256: c8a2e9bccf597c2fb6dc66bee293fc13f2fc47ec77bc6b2b0d52c11f51192ab8
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/apk-signature.txt"
          grep -Fx "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT_SHA256" "$RUNNER_TEMP/apk-signature.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: THT-Split-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: THT-Split-Worker
          path: THT-Split-Worker.zip
          retention-days: 7
