name: Phát hành APK cùng khóa ký
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag phát hành (ví dụ v0.3.0)
        required: true
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0 platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test server/worker.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kiểm tra QR nhận ủng hộ đúng tài khoản
        run: |
          python3 -m pip install 'Pillow>=10,<13' 'zxing-cpp==3.0.0'
          python3 server/verify-donation.py
      - name: Kiểm tra gói Worker không triển khai
        working-directory: server
        run: npx --yes wrangler@4 deploy --dry-run --outdir "$RUNNER_TEMP/worker-check"
      - name: Kiểm tra cấu hình và giải mã khóa ký
        env:
          KEYSTORE_B64: ${{ secrets.THT_KEYSTORE_B64 }}
          THT_STORE_PASSWORD: ${{ secrets.THT_STORE_PASSWORD }}
          THT_KEY_ALIAS: ${{ secrets.THT_KEY_ALIAS }}
          THT_KEY_PASSWORD: ${{ secrets.THT_KEY_PASSWORD }}
          THT_CONTROL_URL: ${{ vars.THT_CONTROL_URL || 'https://chiamanhinh.mavoice.workers.dev' }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$THT_STORE_PASSWORD" && test -n "$THT_KEY_ALIAS" && test -n "$THT_KEY_PASSWORD" && test -n "$THT_CONTROL_URL"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tht-signing.jks"
          chmod 600 "$RUNNER_TEMP/tht-signing.jks"
          echo "THT_KEYSTORE_PATH=$RUNNER_TEMP/tht-signing.jks" >> "$GITHUB_ENV"
      - run: chmod +x gradlew && ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
        env:
          THT_CONTROL_URL: ${{ vars.THT_CONTROL_URL || 'https://chiamanhinh.mavoice.workers.dev' }}
          THT_STORE_PASSWORD: ${{ secrets.THT_STORE_PASSWORD }}
          THT_KEY_ALIAS: ${{ secrets.THT_KEY_ALIAS }}
          THT_KEY_PASSWORD: ${{ secrets.THT_KEY_PASSWORD }}
      - name: Đính kèm APK và checksum vào Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          cp app/build/outputs/apk/release/app-release.apk THT-Split.apk
          sha256sum THT-Split.apk > THT-Split.apk.sha256
          gh release create "$RELEASE_TAG" THT-Split.apk THT-Split.apk.sha256 --target "$GITHUB_SHA" --title "THT Split $RELEASE_TAG" --generate-notes
