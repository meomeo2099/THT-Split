plugins { id 'com.android.application' }
android {
    namespace 'com.tht.split'
    compileSdk 35
    buildFeatures { buildConfig true }
    // Automotive sideload build; target 32 is deliberate, not a Google Play upload.
    lint { disable 'ExpiredTargetSdkVersion' }
    defaultConfig {
        applicationId 'com.tht.split'; minSdk 26; targetSdk 32; versionCode 36; versionName '0.3.24'
        testInstrumentationRunner 'com.tht.split.NativeUiTestRunner'
        manifestPlaceholders = [appLabel: 'THT Split']
        buildConfigField 'boolean', 'PLATFORM_TEST', 'false'
        buildConfigField 'boolean', 'SYSTEM_ONLY', 'false'
        buildConfigField 'boolean', 'PLATFORM_RELEASE', 'false'
        def controlUrl = providers.environmentVariable('THT_CONTROL_URL').getOrElse('').trim()
        if (!controlUrl) controlUrl = 'https://chiamanhinh.mavoice.workers.dev'
        if (controlUrl && !(controlUrl ==~ /https:\/\/[a-zA-Z0-9.-]+/)) throw new GradleException('THT_CONTROL_URL phải là HTTPS origin')
        buildConfigField 'String', 'CONTROL_URL', '"' + controlUrl + '"'
    }
    signingConfigs {
        stable {
            if (System.getenv('THT_KEYSTORE_PATH')) {
                storeFile file(System.getenv('THT_KEYSTORE_PATH'))
                storePassword System.getenv('THT_STORE_PASSWORD')
                keyAlias System.getenv('THT_KEY_ALIAS')
                keyPassword System.getenv('THT_KEY_PASSWORD')
            }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    testBuildType 'thtSignRelease'
    buildTypes {
        debug { if (System.getenv('THT_KEYSTORE_PATH')) signingConfig signingConfigs.stable }
        release { minifyEnabled false; if (System.getenv('THT_KEYSTORE_PATH')) signingConfig signingConfigs.stable }
        platformTest {
            initWith release
            applicationIdSuffix '.platformtest'
            buildConfigField 'boolean', 'SYSTEM_ONLY', 'true'
            versionNameSuffix '-platformtest1'
            signingConfig null
            matchingFallbacks = ['release']
            manifestPlaceholders = [appLabel: 'THT Split Platform Test']
            buildConfigField 'boolean', 'PLATFORM_TEST', 'true'
            buildConfigField 'String', 'CONTROL_URL', '""'
        }
        platformRelease {
            initWith release
            versionNameSuffix '-platform'
            buildConfigField 'boolean', 'SYSTEM_ONLY', 'false'
            signingConfig null
            matchingFallbacks = ['release']
            manifestPlaceholders = [appLabel: 'THT Split']
            buildConfigField 'boolean', 'PLATFORM_TEST', 'true'
            buildConfigField 'boolean', 'PLATFORM_RELEASE', 'true'
        }
        // Same app as platformRelease; CI signs it with the shared THT_SIGN_* key (also the platform cert).
        // Selectable system/ADB/Off with EX2 and Coolray compatibility controls.
        thtSignRelease {
            initWith platformRelease
            versionNameSuffix '-methods'
            signingConfig null
            matchingFallbacks = ['release']
        }
    }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }

// Compile-only API signatures; the real Unsafe is supplied by Android's boot classloader.
tasks.register('compileHiddenApiStubs', JavaCompile) {
    source = fileTree('../third_party/hidden_api_stubs') { include '**/*.java' }
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('hidden-api-stubs/classes')
    options.release = 8
}
tasks.register('hiddenApiStubsJar', Jar) {
    dependsOn 'compileHiddenApiStubs'
    from layout.buildDirectory.dir('hidden-api-stubs/classes')
    archiveFileName = 'hidden-api-stubs.jar'
    destinationDirectory = layout.buildDirectory.dir('hidden-api-stubs')
}
dependencies { compileOnly files(tasks.named('hiddenApiStubsJar')) }


